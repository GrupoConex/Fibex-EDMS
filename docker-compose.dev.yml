services:
  web:
    image: fibex-edms-app:latest
    container_name: fibex-dev
    network_mode: host
    volumes:
      - .:/app:z
    working_dir: /app
    environment:
      - DJANGO_SETTINGS_MODULE=mayan.settings.development
      - MAYAN_MEDIA_ROOT=/app/mayan/media
      - PYTHONUNBUFFERED=1
    command: python manage.py runserver 0.0.0.0:8000 --settings=mayan.settings.development
